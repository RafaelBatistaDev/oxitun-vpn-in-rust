name: docker

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/rafaelbatistadev/oxitun
  DOCKERHUB_IMAGE: rafaelbs2026/oxitun
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  # Optional neutral namespace (e.g. ghcr.io/<org>/oxitun or oxitun/oxitun).
  # Set the repo variable NEUTRAL_IMAGE to enable; ghcr targets also need
  # the NEUTRAL_GHCR_TOKEN secret (PAT with write:packages on the org).
  NEUTRAL_IMAGE: ${{ vars.NEUTRAL_IMAGE }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta-ghcr
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-ghcr.outputs.tags }}
          labels: ${{ steps.meta-ghcr.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta-dockerhub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Push to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-dockerhub.outputs.tags }}
          labels: ${{ steps.meta-dockerhub.outputs.labels }}
          cache-from: type=gha

      - name: Login to neutral GHCR namespace
        if: env.NEUTRAL_IMAGE != '' && startsWith(env.NEUTRAL_IMAGE, 'ghcr.io/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.NEUTRAL_GHCR_TOKEN }}

      - id: meta-neutral
        if: env.NEUTRAL_IMAGE != ''
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.NEUTRAL_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Push to neutral image
        if: env.NEUTRAL_IMAGE != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta-neutral.outputs.tags }}
          labels: ${{ steps.meta-neutral.outputs.labels }}
          cache-from: type=gha
